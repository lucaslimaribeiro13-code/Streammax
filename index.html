<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StreamMax</title>

<meta name="description" content="Catálogo online de filmes e séries">

<link rel="preconnect" href="https://api.themoviedb.org">
<link rel="preconnect" href="https://image.tmdb.org">

<script src="https://cdn.tailwindcss.com"></script>

<style>
body { background:#121212; color:white; font-family:sans-serif; }
.section-title { margin:30px 0 15px; font-size:20px; font-weight:bold; }

.grid-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.card {
  background: #1e1e1e;
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.2s;
}
.card:hover { transform: scale(1.02); background:#252525; }
.card img { width:100%; display:block; }

.card-info { padding:10px; }
.card-info h3 { font-weight:bold; margin-bottom:5px; }
.card-info p { font-size:0.85rem; opacity:0.7; }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  overflow-y: auto;
  padding: 30px 15px;
  z-index: 9999;
}

iframe { width:100%; aspect-ratio:16/9; border-radius:10px; }

.loading { text-align:center; padding:20px; opacity:0.6; }

.banner-container {
  position: relative;
  border-radius: 10px;
  overflow: hidden;
  margin-bottom: 20px;
}

.banner-img {
  width:100%;
  max-height:480px;
  object-fit:cover;
}

.banner-overlay {
  position:absolute;
  inset:0;
  background: linear-gradient(to top, rgba(0,0,0,0.85) 25%, rgba(0,0,0,0.2) 70%);
  display:flex;
  align-items:flex-end;
  padding:25px;
}
</style>
</head>

<body>

<header class="p-4 flex flex-col md:flex-row gap-4 md:justify-between md:items-center bg-black sticky top-0 z-50">

<div class="flex flex-col">
  <h1 class="text-2xl font-bold text-purple-500 cursor-pointer">StreamMax</h1>
  <div class="flex gap-4 mt-2">
    <button id="btnMovies" class="text-lg font-semibold text-gray-300 hover:text-purple-400 transition">Filmes</button>
    <button id="btnSeries" class="text-lg font-semibold text-gray-300 hover:text-purple-400 transition">Séries</button>
  </div>
</div>

<div class="flex gap-2 items-end w-full md:w-auto">
  <div id="genreContainer" class="hidden flex flex-col">
    <span class="text-sm text-gray-400 mb-1">Gênero</span>
    <select id="genreSelect" class="bg-[#1E1E1E] px-4 py-2 rounded">
      <option value="">Todos</option>
    </select>
  </div>

<input id="searchInput" type="text"
placeholder="Buscar..."
class="bg-[#1E1E1E] px-4 py-2 rounded w-full md:w-80 outline-none">

<button id="searchButton"
class="bg-purple-600 px-4 py-2 rounded hover:bg-purple-700 transition">
Buscar
</button>
</div>
</header>

<main class="p-6">

<h2 id="trendingTitle" class="section-title">🔥 Em Alta</h2>
<div id="trending" class="grid-row"></div>

<h2 id="searchTitle" class="section-title hidden"></h2>
<div id="catalog" class="grid-row"></div>

<div id="observerTarget"></div>

<div id="loading" class="loading hidden">Carregando...</div>

</main>

<div id="playerModal" class="modal">
<div class="w-full max-w-6xl mx-auto">
<div class="flex justify-end mb-3">
<button onclick="closePlayer()" class="text-3xl">&times;</button>
</div>
<div id="playerContainer"></div>
</div>
</div>

<script>
const TMDB_API_KEY="1cb0150565ed301986102d425eda82f9";
const IMG_BASE="https://image.tmdb.org/t/p/w500";
const BANNER_BASE="https://image.tmdb.org/t/p/w1280";

let currentType=null;
let currentPage=1;
let totalPages=1;
let currentGenre="";
let currentSearch="";
let isLoading=false;

const cache = {};
let searchTimeout;

document.addEventListener("DOMContentLoaded",()=>{
 loadTrending();
 document.getElementById("btnMovies").onclick=()=>initType("movie");
 document.getElementById("btnSeries").onclick=()=>initType("tv");
 document.getElementById("searchButton").onclick=debouncedSearch;
 document.getElementById("genreSelect").onchange=e=>{
   currentGenre=e.target.value;
   resetCatalog();
   loadContent();
 };
 document.querySelector("h1").onclick=resetHome;
 setupObserver();
});

/* INTERSECTION OBSERVER */
function setupObserver(){
 const observer = new IntersectionObserver(entries=>{
   if(entries[0].isIntersecting){
     if(!isLoading && currentPage < totalPages){
       currentPage++;
       loadContent();
     }
   }
 },{ threshold:1 });

 observer.observe(document.getElementById("observerTarget"));
}

/* CACHE FETCH */
async function fetchWithCache(url){
 if(cache[url]) return cache[url];
 const res = await fetch(url);
 const data = await res.json();
 cache[url] = data;
 return data;
}

function resetCatalog(){
 document.getElementById("catalog").innerHTML="";
 currentPage=1;
}

function resetHome(){
 currentType=null;
 currentSearch="";
 currentGenre="";
 document.getElementById("genreContainer").classList.add("hidden");
 document.getElementById("searchTitle").classList.add("hidden");
 document.getElementById("trendingTitle").style.display="block";
 document.getElementById("trending").style.display="grid";
 document.getElementById("catalog").innerHTML="";
}

async function loadTrending(){
 const url=`https://api.themoviedb.org/3/trending/all/week?api_key=${TMDB_API_KEY}&language=pt-BR`;
 const data=await fetchWithCache(url);
 renderItems(data.results,"trending");
}

async function initType(type){
 currentType=type;
 currentSearch="";
 currentGenre="";
 resetCatalog();
 document.getElementById("trending").style.display="none";
 document.getElementById("trendingTitle").style.display="none";
 document.getElementById("searchTitle").classList.remove("hidden");
 document.getElementById("searchTitle").innerText=type==="movie"?"🎬 Filmes":"📺 Séries";
 document.getElementById("genreContainer").classList.remove("hidden");
 await loadGenres(type);
 loadContent();
}

async function loadGenres(type){
 const url=`https://api.themoviedb.org/3/genre/${type}/list?api_key=${TMDB_API_KEY}&language=pt-BR`;
 const data=await fetchWithCache(url);
 const select=document.getElementById("genreSelect");
 select.innerHTML='<option value="">Todos</option>';
 data.genres.forEach(g=>{
   select.insertAdjacentHTML("beforeend", `<option value="${g.id}">${g.name}</option>`);
 });
}

function debouncedSearch(){
 clearTimeout(searchTimeout);
 searchTimeout=setTimeout(()=>handleSearch(),400);
}

function handleSearch(){
 const q=document.getElementById("searchInput").value.trim();
 if(!q) return;
 currentSearch=q;
 currentType=null;
 currentGenre="";
 resetCatalog();
 document.getElementById("genreContainer").classList.add("hidden");
 document.getElementById("trending").style.display="none";
 document.getElementById("trendingTitle").style.display="none";
 document.getElementById("searchTitle").classList.remove("hidden");
 document.getElementById("searchTitle").innerText="🔎 Resultados";
 loadContent();
}

async function loadContent(){
 if(isLoading || currentPage>totalPages) return;
 isLoading=true;
 document.getElementById("loading").classList.remove("hidden");

 let url;
 if(currentSearch){
   url=`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=pt-BR&query=${encodeURIComponent(currentSearch)}&page=${currentPage}`;
 }else{
   url=`https://api.themoviedb.org/3/discover/${currentType}?api_key=${TMDB_API_KEY}&language=pt-BR&sort_by=popularity.desc&page=${currentPage}${currentGenre?`&with_genres=${currentGenre}`:""}`;
 }

 const data=await fetchWithCache(url);
 totalPages=data.total_pages;
 renderItems(data.results,"catalog");

 isLoading=false;
 document.getElementById("loading").classList.add("hidden");
}

function renderItems(items,containerId){
 const container=document.getElementById(containerId);
 items.forEach(item=>{
   if(!item.poster_path) return;
   const type=item.media_type?(item.media_type==="tv"?"serie":"filme"):(currentType==="tv"?"serie":"filme");
   container.insertAdjacentHTML("beforeend",`
   <div class="card" onclick="openPlayer('${type}','${item.id}')">
     <img loading="lazy" src="${IMG_BASE+item.poster_path}">
     <div class="card-info">
       <h3>${item.title||item.name}</h3>
       <p>${(item.overview||"").substring(0,100)}...</p>
     </div>
   </div>`);
 });
}

function openPlayer(type,id){
 if(type==="filme") openMovie(id);
 else openSeries(id);
}

async function openMovie(id){
 const url=`https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=pt-BR`;
 const data=await fetchWithCache(url);

 const year=data.release_date?.substring(0,4)||"—";
 const runtime=data.runtime?data.runtime+" min":"—";
 const rating=data.vote_average?.toFixed(1)||"—";

 document.getElementById("playerContainer").innerHTML=`
 <div>
   <div class="banner-container">
     <img src="${BANNER_BASE+data.backdrop_path}" class="banner-img">
     <div class="banner-overlay">
       <div>
         <h2 class="text-3xl font-bold mb-2">${data.title}</h2>
         <div class="flex gap-5 text-sm opacity-90">
           <span>⭐ ${rating}</span>
           <span>📅 ${year}</span>
           <span>⏱️ ${runtime}</span>
         </div>
       </div>
     </div>
   </div>

   <p class="mb-6 opacity-80">
     ${data.overview||"Sem descrição disponível."}
   </p>

   <iframe src="https://playerflixapi.com/filme/${id}" allowfullscreen></iframe>
 </div>`;

 document.getElementById("playerModal").style.display="block";
}

/* SÉRIES */
async function openSeries(id){
 const url=`https://api.themoviedb.org/3/tv/${id}?api_key=${TMDB_API_KEY}&language=pt-BR`;
 const data=await fetchWithCache(url);
 const seasons=data.seasons.filter(s=>s.season_number>0);

 document.getElementById("playerContainer").innerHTML=`
 <div>
   <h2 class="text-2xl font-bold mb-2">${data.name}</h2>
   <p class="mb-4 opacity-80">${data.overview}</p>

   <select id="seasonSelect"
   class="bg-[#1E1E1E] px-4 py-2 rounded mb-4"
   onchange="loadEpisodes(${id},this.value)">
   ${seasons.map(s=>`<option value="${s.season_number}">Temporada ${s.season_number}</option>`).join("")}
   </select>

   <div id="episodesList" class="flex gap-2 overflow-x-auto mb-6"></div>
   <div id="episodeInfo" class="mb-4"></div>
   <div id="episodePlayer"></div>
 </div>`;

 document.getElementById("playerModal").style.display="block";
 loadEpisodes(id,seasons[0].season_number);
}

async function loadEpisodes(seriesId,seasonNumber){
 const url=`https://api.themoviedb.org/3/tv/${seriesId}/season/${seasonNumber}?api_key=${TMDB_API_KEY}&language=pt-BR`;
 const data=await fetchWithCache(url);
 const list=document.getElementById("episodesList");
 list.innerHTML="";
 data.episodes.forEach(ep=>{
   list.insertAdjacentHTML("beforeend",`
   <button class="bg-purple-600 px-3 py-2 rounded whitespace-nowrap"
   onclick="playEpisode(${seriesId},${seasonNumber},${ep.episode_number},\`${ep.name}\`,\`${ep.overview}\`)">
   ${ep.episode_number}. ${ep.name}
   </button>`);
 });
}

function playEpisode(seriesId,seasonNumber,episodeNumber,name,overview){
 document.getElementById("episodePlayer").innerHTML=
 `<iframe src="https://playerflixapi.com/serie/${seriesId}/${seasonNumber}/${episodeNumber}" allowfullscreen></iframe>`;

 document.getElementById("episodeInfo").innerHTML=
 `<h3 class="text-lg font-bold mb-2">
 Episódio ${episodeNumber} — ${name}
 </h3>
 <p>${overview||"Sem descrição disponível."}</p>`;
}

function closePlayer(){
 document.getElementById("playerModal").style.display="none";
 document.getElementById("playerContainer").innerHTML="";
}
</script>

</body>
</html>
